[project]
name = "robotframework-mcp"
version = "1.3.0"
description = "MCP server for Robot Framework test automation (SeleniumLibrary and Playwright/Browser library backends)"
authors = [
    {name = "Meenu rani", email = "meenu.rani@sourcefuse.com"}
]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["mcp", "selenium", "playwright", "browser", "testing", "robot-framework", "automation"]
dependencies = [
    "mcp>=1.2.0",  # FastMCP (1.x) / MCPServer (2.x); both supported
    "robotframework>=6.0",
    "selenium>=4.0.0",
    "robotframework-seleniumlibrary>=6.0",
]

[project.optional-dependencies]
# Playwright-based Robot Framework Browser library backend (--library=browser).
# After installing, run once:  robotframework-mcp --library=browser --setup
browser = [
    "robotframework>=7.0",
    "robotframework-browser>=19.0.0",
]

[project.scripts]
robotframework-mcp = "run_mcp:main"

[project.urls]
Homepage = "https://github.com/sourcefuse/robotframework-MCP"
Repository = "https://github.com/sourcefuse/robotframework-MCP.git"
Issues = "https://github.com/sourcefuse/robotframework-MCP/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["mcp_server", "run_mcp"]
packages = ["rf_browser_mcp"]
package-dir = {"rf_browser_mcp" = "browser/src/rf_browser_mcp"}
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.md", "*.txt", "*.json", "*.js", "*.bat", "bin/*", "scripts/*"]