[project]
name = "rf-browser-mcp"
version = "0.1.0"
description = "MCP server exposing Robot Framework's Browser library (Playwright-based) as tools for LLM-driven browser automation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "robotframework>=7.0",
    "robotframework-browser>=19.0.0",
]

[project.scripts]
rf-browser-mcp = "rf_browser_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rf_browser_mcp"]
